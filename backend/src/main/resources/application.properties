# ============================================================
# Moto Boutique - API REST - Configuración común a todos los perfiles
# ============================================================
spring.application.name=motoboutique

# Perfil por defecto: dev (en producción se activa con SPRING_PROFILES_ACTIVE=prod)
spring.profiles.default=dev

# Servidor
server.port=8081

# Idioma y codificación
spring.web.locale=es_PE
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Base de datos (PostgreSQL). La contraseña NO tiene valor por defecto a propósito:
# si falta, la aplicación no arranca y avisa claramente.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:motoboutique}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# Orígenes del frontend autorizados a llamar a la API (CORS), separados por coma.
# Con el proxy de Vite en desarrollo no hace falta, pero se deja listo para otros despliegues.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JPA / Hibernate: el esquema lo manejan SOLO las migraciones Flyway
spring.jpa.hibernate.ddl-auto=validate
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset.token-ttl-minutes=${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
app.resend.api-key=${RESEND_API_KEY:}
app.resend.email-from=${EMAIL_FROM:}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Los seeders se habilitan solo de forma explícita (por ejemplo, durante el bootstrap inicial).
app.seed.enabled=${APP_SEED_ENABLED:false}

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false